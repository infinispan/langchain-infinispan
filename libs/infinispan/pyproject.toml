[tool.poetry]
name = "langchain-infinispan"
version = "0.1.0"
description = "An integration package connecting Infinispan and LangChain"
authors = []
readme = "README.md"
repository = "https://github.com/infinispan/langchain-infinispan"
license = "Apache-2.0"

[tool.poetry.urls]
"Source Code" = "https://github.com/infinispan/langchain-infinispan"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
langchain-core = "^1.2.5"
requests = ">=2.28.0,<3.0.0"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = ">=7.3,<9.0"
pytest-mock = "^3.10.0"
pytest-asyncio = ">=0.21.1,<1.4.0"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = ">=0.1.5,<0.16.0"

[tool.poetry.group.typing.dependencies]
mypy = ">=0.991,<1.20"

[tool.poetry.group.test_integration]
optional = true

[tool.poetry.group.test_integration.dependencies]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "I",  # isort
]

[tool.mypy]
disallow_untyped_defs = "True"

[tool.coverage.run]
omit = ["tests/*"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = [
  "requires: mark tests as requiring a specific library",
]
